name: Atualizar dados
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-dados
  cancel-in-progress: false
jobs:
  funil:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependência (pg)
        run: npm install pg --no-save --no-audit --no-fund
      - name: Gerar funil.json (Supabase + Google + Meta)
        continue-on-error: true
        env:
          KRONOS_PASS: ${{ secrets.KRONOS_PASS }}
          GERADOR_DB_URL: ${{ secrets.GERADOR_DB_URL }}
          GOOGLE_CSV_URL: ${{ secrets.GOOGLE_CSV_URL }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: node scripts/ler-funil.mjs
      - name: Gerar leads.json (Supabase + Brevo, cifrado)
        continue-on-error: true
        env:
          KRONOS_PASS: ${{ secrets.KRONOS_PASS }}
          GERADOR_DB_URL: ${{ secrets.GERADOR_DB_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: node scripts/ler-leads.mjs
      - name: Gerar financeiro.json (custo unificado, cifrado)
        continue-on-error: true
        env:
          KRONOS_PASS: ${{ secrets.KRONOS_PASS }}
          GERADOR_DB_URL: ${{ secrets.GERADOR_DB_URL }}
          GOOGLE_CSV_URL: ${{ secrets.GOOGLE_CSV_URL }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: node scripts/ler-financeiro.mjs
      - name: Commitar se mudou (aguenta corrida de push)
        run: |
          git config user.name "kronos-bot"
          git config user.email "bot@kronos-ias.com.br"
          git add www/contexto/funil.json www/contexto/leads.json www/contexto/financeiro.json
          if git diff --cached --quiet; then
            echo "Nada mudou — sem commit."
            exit 0
          fi
          git commit -m "chore(dados): atualiza funil + leads + financeiro (cron)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "push ok na tentativa $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "corrida de push — tentativa $i falhou, re-tentando em 6s..."
            sleep 6
          done
          echo "push falhou apos 5 tentativas"
          exit 1
