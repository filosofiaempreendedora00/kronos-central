  </defs>
  <!-- sprig de folhas, canto inferior esquerdo -->
  <g opacity="0.5" fill="none" stroke="url(#leaf)" stroke-width="1.4" stroke-linecap="round">
    <path d="M30 320 C 40 270 52 232 84 206"/>
    <path d="M58 250 C 40 246 30 232 30 214 C 50 214 62 226 58 250 Z" fill="url(#leaf)" stroke="none"/>
    <path d="M72 224 C 56 218 48 202 50 184 C 70 188 80 204 72 224 Z" fill="url(#leaf)" stroke="none"/>
    <path d="M70 252 C 86 250 100 240 104 224 C 88 218 72 230 70 252 Z" fill="url(#leaf)" stroke="none"/>
  </g>
  <!-- borboleta grande -->
  <g transform="translate(372 70) rotate(-12)" opacity="0.62">
    <g fill="url(#wing)" stroke="#3f6b3c" stroke-width="0.7">
      <path d="M0 0 C -34 -30 -52 -22 -46 6 C -42 24 -18 18 0 0 Z"/>
      <path d="M0 0 C 34 -30 52 -22 46 6 C 42 24 18 18 0 0 Z"/>
      <path d="M0 0 C -24 6 -34 22 -22 36 C -8 34 -2 16 0 0 Z"/>
      <path d="M0 0 C 24 6 34 22 22 36 C 8 34 2 16 0 0 Z"/>
    </g>
    <line x1="0" y1="-6" x2="0" y2="30" stroke="#2f5530" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M0 -6 C -5 -16 -10 -18 -13 -16" fill="none" stroke="#2f5530" stroke-width="0.8"/>
    <path d="M0 -6 C 5 -16 10 -18 13 -16" fill="none" stroke="#2f5530" stroke-width="0.8"/>
  </g>
  <!-- borboleta pequena -->
  <g transform="translate(250 220) rotate(18) scale(0.62)" opacity="0.5">
    <g fill="url(#wing)" stroke="#3f6b3c" stroke-width="0.8">
      <path d="M0 0 C -34 -30 -52 -22 -46 6 C -42 24 -18 18 0 0 Z"/>
      <path d="M0 0 C 34 -30 52 -22 46 6 C 42 24 18 18 0 0 Z"/>
      <path d="M0 0 C -24 6 -34 22 -22 36 C -8 34 -2 16 0 0 Z"/>
      <path d="M0 0 C 24 6 34 22 22 36 C 8 34 2 16 0 0 Z"/>
    </g>
    <line x1="0" y1="-6" x2="0" y2="30" stroke="#2f5530" stroke-width="1.6" stroke-linecap="round"/>
  </g>
